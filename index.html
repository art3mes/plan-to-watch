<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Plan to Watch</title>
    <meta name="description" content="Every anime at once. Explore 21,474 series and films in an interactive force-directed voronoi diagram of poster art." />
    <meta name="keywords" content="anime, manga, series, movies, discovery, visualization, interactive, WebGL, voronoi, force-directed graph, MyAnimeList, Kitsu" />
    <meta name="author" content="Plan to Watch" />
    <link rel="canonical" href="https://plan-to-watch.pages.dev/" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Plan to Watch - Every Anime at Once" />
    <meta property="og:description" content="Every anime at once. Explore 21,474 series and films in an interactive force-directed voronoi diagram of poster art." />
    <meta property="og:url" content="https://plan-to-watch.pages.dev/" />
    <meta property="og:site_name" content="Plan to Watch" />
    <meta property="og:image" content="https://plan-to-watch.pages.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Interactive anime poster wall visualization" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plan to Watch - Every Anime at Once" />
    <meta name="twitter:description" content="Every anime at once. Explore 21,474 series and films in an interactive force-directed voronoi diagram of poster art." />
    <meta name="twitter:image" content="https://plan-to-watch.pages.dev/og.jpg" />
    <meta name="twitter:image:alt" content="Interactive anime poster wall visualization" />

    <!-- Additional Meta -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plan to Watch" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  </head>
  <body class="bg-background">
    <div id="root"></div>
    <div
      id="voroforce"
      class="pointer-events-auto fixed inset-x-0 top-0 h-dvh w-screen"
    >
      <canvas class="h-full w-full pointer-events-none"></canvas>
    </div>
    <script type="module" src="/app/main.tsx"></script>

</html>
